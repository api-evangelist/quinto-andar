aid: quinto-andar
name: Quinto Andar
description: QuintoAndar is a Brazilian proptech real-estate marketplace that lets people rent and buy
  homes online without a guarantor, with digital visit scheduling, digital contract signing, rent and
  sale pricing intelligence (QPreço), owner financial management, and a real-estate consortium financing
  program. It operates a two-sided marketplace across major Brazilian cities including São Paulo, Rio
  de Janeiro, Belo Horizonte, Porto Alegre, Campinas, and Curitiba, earning revenue on rental and sales
  commissions. Surfaced as a portfolio company of ribbit-capital and enriched into the API Evangelist
  network. No public developer API surface was found; the company does publish a security.txt with a Bugcrowd
  bug bounty program.
